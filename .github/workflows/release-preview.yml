name: Release Preview

on:
  pull_request:
    branches: [master]
    paths:
      - VERSION
      - action.yml
      - README.md
      - mise.toml
      - .github/workflows/release.yml
      - .github/workflows/release-preview.yml
      - scripts/**
      - tests/**

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    name: Release Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Fetch master and tags
        run: |
          git fetch --force --tags origin
          git fetch --force origin master:refs/remotes/origin/master

      - name: Validate release
        run: python scripts/check_release.py --mode pr --base-ref origin/master

      - name: Prepare changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(cat VERSION)"
          tag="v${version}"
          major="v${version%%.*}"
          current_commit="$(git rev-parse HEAD)"
          previous_tag="$(git tag -l 'v*.*.*' --sort=-v:refname | awk -v current="$tag" '$0 != current { print; exit }')"
          changelog_base="$previous_tag"
          notes_file="$RUNNER_TEMP/release-notes.md"

          if [ -z "$changelog_base" ]; then
            changelog_base="origin/master"
          fi

          python scripts/generate_changelog.py \
            --base-ref "$changelog_base" \
            --head-ref "$current_commit" \
            --repo "$GITHUB_REPOSITORY" \
            --current-pr-number "${{ github.event.pull_request.number }}" > "$notes_file"

          {
            echo "## Release preview"
            echo
            echo "- Version tag: \`${tag}\`"
            echo "- Moving major tag: \`${major}\`"
            echo "- Target commit: \`${current_commit}\`"
            echo "- Changelog starts at: \`${changelog_base}\`"
            echo
            echo "## Changelog preview"
            echo
            cat "$notes_file"
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$notes_file"
