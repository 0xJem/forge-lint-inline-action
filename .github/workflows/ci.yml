name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            task: lint-check
          - name: Format
            task: format-check
          - name: Build
            task: build-check
          - name: Test
            task: test-check
    steps:
      - uses: ./.github/actions/setup

      - name: Run ${{ matrix.name }}
        run: mise run ${{ matrix.task }}
