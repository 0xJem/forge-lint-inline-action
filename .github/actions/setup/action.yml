name: Setup Repository
description: Checkout the repository and install pinned mise tools.

inputs:
  fetch-depth:
    description: History depth passed to actions/checkout.
    default: "1"
  ref:
    description: Git ref or SHA passed to actions/checkout.
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      # actions/checkout v5
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}

    - name: Install mise tools
      # jdx/mise-action v3.4.1
      uses: jdx/mise-action@9dc7d5dd454262207dea3ab5a06a3df6afc8ff26
      with:
        version: 2026.4.25
        install: true
        cache: true
